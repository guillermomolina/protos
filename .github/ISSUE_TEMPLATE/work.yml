name: Tracked project work
description: Maintainer-only intake for an already-allocated formal Protos work item; exploratory ideas and unresolved design belong in Discussions first.
labels: ["status:inbox"]
body:
  - type: markdown
    attributes:
      value: |
        Maintainer use only: use this form only when the formal identifier has already been allocated under `AGENTS.md`. If you do not already have an allocated identifier, use Community request or Discussions instead.

        `spec/`, ratified `Dxxx` / `PLATxxx`, and repository blocker records remain
        authoritative where applicable. This Issue coordinates work; it cannot approve
        or redefine Protos semantics or durable architecture.

        Formal identifiers are maintainer-allocated under the collision-safe allocation
        rule in `AGENTS.md`. Creating an Issue reserves a candidate; uniqueness must be
        rechecked before any durable publication under a newly allocated identifier.

  - type: input
    id: work-item
    attributes:
      label: Work item
      description: Maintainer-allocated formal identifier and short name; the Issue title must begin with the same identifier.
      placeholder: "I031 — Short descriptive name"
    validations:
      required: true

  - type: input
    id: parent-issue
    attributes:
      label: Parent issue
      description: For a formal child, enter its parent as #N. For a top-level work item, enter none.
      placeholder: "#47 or none"
    validations:
      required: true

  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What concrete outcome should this work produce?
    validations:
      required: true

  - type: textarea
    id: authority
    attributes:
      label: Authority and design records
      description: Link the specification, ratified Dxxx/PLATxxx, blocker, project record, or prior Discussion that constrains this work.
      placeholder: |
        - spec/...
        - D0xx / PLAT0xx / B0xx
        - Discussion #...
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List work items, blockers, decisions, or external prerequisites that must already be satisfied.
      placeholder: |
        - #...
        - B0xx
        - none

  - type: textarea
    id: non-goals
    attributes:
      label: Non-goals
      description: What is deliberately outside this work item?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: State observable completion criteria. Prefer explicit, testable conditions.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: What focused/static/full-suite evidence is required before publication or closure?
    validations:
      required: true

  - type: checkboxes
    id: governance
    attributes:
      label: Governance boundary
      options:
        - label: This Issue coordinates actionable work and does not itself approve Protos semantics or durable architecture.
          required: true
