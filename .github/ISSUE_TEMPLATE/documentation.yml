name: Documentation problem
description: Report missing, unclear, inconsistent, or incorrect documentation
title: "[Docs] "
body:
  - type: textarea
    id: location
    attributes:
      label: Documentation location
      description: Link or name the README, guide, specification, example, or other documentation involved.
      placeholder: docs/guide/..., README.md, spec/...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is missing, unclear, inconsistent, or incorrect?
    validations:
      required: true

  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
      description: Optional wording, example, or structure that would make this clearer.

  - type: checkboxes
    id: semantics
    attributes:
      label: Semantic impact
      options:
        - label: This may expose a language-design/specification ambiguity rather than a documentation-only problem.

  - type: markdown
    attributes:
      value: |
        If the issue is primarily an exploratory design proposal, consider starting
        in GitHub Discussions instead.
