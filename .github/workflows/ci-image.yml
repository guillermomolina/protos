name: CI image

on:
  push:
    branches:
      - main
    paths:
      - .devcontainer/Dockerfile
      - .devcontainer/devcontainer.json
      - .devcontainer/devcontainer-lock.json
      - .github/workflows/ci-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      IMAGE_NAME: ghcr.io/guillermomolina/protos-ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build CI image
        uses: docker/build-push-action@v7
        with:
          context: .devcontainer
          file: .devcontainer/Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha,scope=protos-ci
          cache-to: type=gha,mode=max,scope=protos-ci

      - name: Verify CI image toolchain
        run: |
          docker run --rm             --volume "${GITHUB_WORKSPACE}:/workspaces/protos"             --workdir /workspaces/protos             "${IMAGE_NAME}:sha-${GITHUB_SHA}"             bash -lc 'python3 tools/verify_toolchain.py --mode check --scope development'

          docker run --rm             "${IMAGE_NAME}:sha-${GITHUB_SHA}"             bash -lc 'java --version && mvn --version && python3 --version && make --version && git --version && gh --version'

      - name: Publish immutable CI image
        run: |
          docker push "${IMAGE_NAME}:sha-${GITHUB_SHA}"

      - name: Publish controlled CI alias
        run: |
          docker push "${IMAGE_NAME}:ci"

      - name: Report published image identity
        run: |
          docker buildx imagetools inspect "${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker buildx imagetools inspect "${IMAGE_NAME}:ci"
