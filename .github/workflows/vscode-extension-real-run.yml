name: VS Code packaged real run

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - VS Code packaged clean install
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  real-run:
    name: Run Protos from installed VSIX
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build Protos runtime
        run: mvn -q -DskipTests package

      - name: Download canonical VSIX artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            RUN_ID="$(gh run list --workflow vscode-extension-artifact.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
            SHA="$(gh run view "$RUN_ID" --json headSha --jq '.headSha')"
          fi

          test -n "$RUN_ID"
          test -n "$SHA"
          mkdir -p ci-artifact
          gh run download "$RUN_ID" \
            --name "protos-vscode-vsix-${SHA}" \
            --dir ci-artifact
          sha256sum --check ci-artifact/protos-vscode.vsix.sha256

      - name: Install VS Code
        shell: bash
        run: |
          wget -qO /tmp/code.deb \
            https://update.code.visualstudio.com/latest/linux-deb-x64/stable
          sudo apt-get update
          sudo apt-get install -y /tmp/code.deb
          sudo apt-get install -y xvfb

      - name: Build real-run harness VSIX
        run: python3 clean_run/make_harness_vsix.py harness.vsix

      - name: Install packaged Protos extension and harness
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/i3b"
          mkdir -p "$RUNNER_TEMP/i3b/extensions" "$RUNNER_TEMP/i3b/user-data"

          code \
            --user-data-dir "$RUNNER_TEMP/i3b/user-data" \
            --extensions-dir "$RUNNER_TEMP/i3b/extensions" \
            --install-extension ci-artifact/protos-vscode.vsix \
            --force

          code \
            --user-data-dir "$RUNNER_TEMP/i3b/user-data" \
            --extensions-dir "$RUNNER_TEMP/i3b/extensions" \
            --install-extension harness.vsix \
            --force

      - name: Execute Run Current File through packaged extension
        shell: bash
        env:
          PROTOS_I3B_RESULT: ${{ runner.temp }}/i3b/result.json
          PROTOS_I3B_FIXTURE: ${{ runner.temp }}/i3b/fixture.protos
          PROTOS_I3B_RUNTIME: ${{ github.workspace }}/bin/protos
        run: |
          printf 'print("LM009-I3-B")\n' > "$PROTOS_I3B_FIXTURE"

          xvfb-run -a code \
            --user-data-dir "$RUNNER_TEMP/i3b/user-data" \
            --extensions-dir "$RUNNER_TEMP/i3b/extensions" \
            "$PROTOS_I3B_FIXTURE" \
            >/tmp/protos-i3b-code.log 2>&1 &
          CODE_PID=$!

          for _ in $(seq 1 90); do
            test -f "$PROTOS_I3B_RESULT" && break
            sleep 1
          done

          if [ ! -f "$PROTOS_I3B_RESULT" ]; then
            cat /tmp/protos-i3b-code.log || true
            kill "$CODE_PID" >/dev/null 2>&1 || true
            echo "LM009_I3B_REAL_RUN_FAILED: no result"
            exit 1
          fi

          python3 clean_run/validate_real_run.py "$PROTOS_I3B_RESULT"
          kill "$CODE_PID" >/dev/null 2>&1 || true
