name: VS Code packaged real debug

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - VS Code packaged real Run
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  real-debug:
    name: Debug Protos from installed VSIX
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Build Protos runtime
        run: mvn -q -DskipTests package

      - name: Download canonical VSIX artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            RUN_ID="${{ github.event.workflow_run.id }}"
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            RUN_ID="$(gh run list --workflow vscode-extension-artifact.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
            SHA="$(gh run view "$RUN_ID" --json headSha --jq '.headSha')"
          fi

          test -n "$RUN_ID"
          test -n "$SHA"
          mkdir -p ci-artifact
          gh run download "$RUN_ID" \
            --name "protos-vscode-vsix-${SHA}" \
            --dir ci-artifact
          sha256sum --check ci-artifact/protos-vscode.vsix.sha256

      - name: Install VS Code and Xvfb
        shell: bash
        run: |
          wget -qO /tmp/code.deb \
            https://update.code.visualstudio.com/latest/linux-deb-x64/stable
          sudo apt-get update
          sudo apt-get install -y /tmp/code.deb xvfb

      - name: Build CI-only debug harness VSIX
        run: python3 debug_harness_make_vsix.py debug-harness.vsix

      - name: Install packaged Protos extension and debug harness
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/i3c"
          mkdir -p "$RUNNER_TEMP/i3c/extensions" "$RUNNER_TEMP/i3c/user-data"

          code \
            --user-data-dir "$RUNNER_TEMP/i3c/user-data" \
            --extensions-dir "$RUNNER_TEMP/i3c/extensions" \
            --install-extension ci-artifact/protos-vscode.vsix \
            --force

          code \
            --user-data-dir "$RUNNER_TEMP/i3c/user-data" \
            --extensions-dir "$RUNNER_TEMP/i3c/extensions" \
            --install-extension debug-harness.vsix \
            --force

      - name: Execute real debugger acceptance
        shell: bash
        env:
          PROTOS_I3C_RESULT: ${{ runner.temp }}/i3c/result.json
          PROTOS_I3C_FIXTURE: ${{ runner.temp }}/i3c/debug_fixture.protos
          PROTOS_I3C_RUNTIME: ${{ github.workspace }}/bin/protos
        run: |
          mkdir -p "$RUNNER_TEMP/i3c"
          cat > "$PROTOS_I3C_FIXTURE" <<'EOF'
          x: 41
          print(x)
          print("done")
          EOF

          xvfb-run -a code \
            --user-data-dir "$RUNNER_TEMP/i3c/user-data" \
            --extensions-dir "$RUNNER_TEMP/i3c/extensions" \
            --new-window \
            "$PROTOS_I3C_FIXTURE" \
            >/tmp/protos-i3c-code.log 2>&1 &
          CODE_PID=$!

          for _ in $(seq 1 120); do
            test -f "$PROTOS_I3C_RESULT" && break
            sleep 1
          done

          if [ ! -f "$PROTOS_I3C_RESULT" ]; then
            cat /tmp/protos-i3c-code.log || true
            kill "$CODE_PID" >/dev/null 2>&1 || true
            echo "LM009_I3C_REAL_DEBUG_FAILED: no result"
            exit 1
          fi

          python3 debug_harness_validate.py "$PROTOS_I3C_RESULT"
          kill "$CODE_PID" >/dev/null 2>&1 || true

          BAD_OPTION="--extensionDevelopment""Path"
          if grep -q -- "$BAD_OPTION" /tmp/protos-i3c-code.log; then
            echo "LM009_I3C_REAL_DEBUG_FAILED: forbidden development-path option detected"
            exit 1
          fi
