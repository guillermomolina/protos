name: VS Code extension artifact

on:
  workflow_dispatch:
  push:
    paths:
      - "editors/vscode/**"
      - ".github/workflows/vscode-extension-artifact.yml"

permissions:
  contents: read

jobs:
  package:
    name: Build canonical VSIX artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate canonicalizer
        run: node --check scripts/canonicalize_vsix.js

      - name: Build production extension
        run: npm run vscode:prepublish

      - name: Package raw VSIX
        run: npm exec --yes vsce -- package --no-dependencies --out raw.vsix

      - name: Validate VSIX content
        run: python3 test/validate_vsix.py raw.vsix

      - name: Derive SOURCE_DATE_EPOCH
        id: source-date
        working-directory: .
        shell: bash
        run: echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Canonicalize VSIX
        run: |
          node scripts/canonicalize_vsix.js             raw.vsix             protos-vscode.vsix             "${{ steps.source-date.outputs.epoch }}"

      - name: Prove reproducibility
        run: python3 test/validate_reproducibility.py raw.vsix

      - name: Verify canonical artifact
        shell: bash
        run: sha256sum protos-vscode.vsix | tee protos-vscode.vsix.sha256

      - name: Upload canonical VSIX
        uses: actions/upload-artifact@v4
        with:
          name: protos-vscode-vsix-${{ github.sha }}
          path: |
            editors/vscode/protos-vscode.vsix
            editors/vscode/protos-vscode.vsix.sha256
          if-no-files-found: error
          retention-days: 14
