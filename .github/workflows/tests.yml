name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 120
    runs-on: ubuntu-latest

    # Four workers for the four-vCPU GitHub runner; local Makefile defaults are eight.
    env:
      JAVA_TEST_JOBS: "4"
      PROTOS_TEST_JOBS: "4"

    container:
      image: ghcr.io/guillermomolina/protos-ci@sha256:44e03c759ccd2b57135f5c0bdbb5060563e858601daa73958ab6cbba2ffc5fe3
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore Maven dependency cache
        uses: actions/cache@v6
        with:
          path: /root/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Report available CPU resources
        run: |
          printf 'CPU_NPROC=%s\n' "$(nproc)"
          printf 'CPU_ONLINE=%s\n' "$(getconf _NPROCESSORS_ONLN)"
          if [ -r /sys/fs/cgroup/cpu.max ]; then
            printf 'CPU_CGROUP_MAX='
            cat /sys/fs/cgroup/cpu.max
          fi
          java -XshowSettings:system -version
          printf 'JAVA_TEST_JOBS=%s\n' "$JAVA_TEST_JOBS"
          printf 'PROTOS_TEST_JOBS=%s\n' "$PROTOS_TEST_JOBS"

      - name: Check repository
        run: make check

      - name: Run Java tests
        run: make test-java

      - name: Run Protos tests
        run: make test-protos

      - name: Run Native Image tests
        run: make test-native
