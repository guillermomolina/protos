name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/graalvm/graalvm-community:25i3-25.0.4.1-ol8-20260825
      options: --user 0

    env:
      PROTOS_PRIMARY_JDK_FEATURE: "25"
      PROTOS_PRIMARY_JDK_VERSION: "25.0.4.1"
      PROTOS_MAVEN_VERSION: "3.9.9"

    steps:
      - name: Provision CI bootstrap tools
        shell: bash
        run: |
          set -euo pipefail
          microdnf install -y git gzip tar python39
          microdnf clean all

          archive="apache-maven-${PROTOS_MAVEN_VERSION}-bin.tar.gz"
          base="https://archive.apache.org/dist/maven/maven-3/${PROTOS_MAVEN_VERSION}/binaries"
          curl --fail --location --silent --show-error "$base/$archive" --output "/tmp/$archive"
          curl --fail --location --silent --show-error "$base/$archive.sha512" --output "/tmp/$archive.sha512"
          expected_sha512="$(cat "/tmp/$archive.sha512")"
          test -n "$expected_sha512"
          test "${#expected_sha512}" -eq 128
          case "$expected_sha512" in
            *[!0-9A-Fa-f]*)
              echo "invalid Maven SHA-512 metadata" >&2
              exit 1
              ;;
          esac
          actual_sha512="$(sha512sum "/tmp/$archive")"
          actual_sha512="${actual_sha512%% *}"
          test "${actual_sha512,,}" = "${expected_sha512,,}"
          echo "MAVEN_ARCHIVE_SHA512_CHECK: PASS"
          tar --extract --gzip --file "/tmp/$archive" --directory /opt
          ln --symbolic "/opt/apache-maven-${PROTOS_MAVEN_VERSION}" /opt/maven
          echo "/opt/maven/bin" >> "$GITHUB_PATH"
          echo "MAVEN_HOME=/opt/maven" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify selected toolchain
        shell: bash
        run: |
          set -euo pipefail
          properties="$(java -XshowSettings:properties -version 2>&1)"
          feature="$(sed -n 's/^[[:space:]]*java\.specification\.version = //p' <<<"$properties" | head -n 1)"
          version="$(sed -n 's/^[[:space:]]*java\.version = //p' <<<"$properties" | head -n 1)"
          printf '%s\n' "$properties" | grep -Ei 'graalvm|java\.vendor|java\.vm\.name|java\.runtime\.name' | grep -Fqi GraalVM
          test "$feature" = "$PROTOS_PRIMARY_JDK_FEATURE"
          test "$version" = "$PROTOS_PRIMARY_JDK_VERSION"
          test "$(mvn --version | sed -n '1s/^Apache Maven \([^[:space:]]*\).*/\1/p')" = "$PROTOS_MAVEN_VERSION"
          python3 tools/verify_toolchain.py --mode check --scope development
          echo "CI_PRIMARY_TOOLCHAIN_CHECK: PASS java.version=$version maven=$PROTOS_MAVEN_VERSION"

      - name: Run impact-aware tests
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          head_sha="$(git rev-parse HEAD)"
          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              ;;
            push)
              base_sha="$PUSH_BEFORE_SHA"
              if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
                base_sha="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "$head_sha")"
              fi
              ;;
            workflow_dispatch)
              base_sha="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "$head_sha")"
              ;;
            *)
              echo "unsupported CI event for validation routing: $EVENT_NAME" >&2
              exit 2
              ;;
          esac

          git cat-file -e "${base_sha}^{commit}"
          echo "CI_VALIDATION_BASE=$base_sha"
          echo "CI_VALIDATION_HEAD=$head_sha"

          python3 scripts/publication_validation.py \
            --repo . \
            --base "$base_sha" \
            --head "$head_sha"
