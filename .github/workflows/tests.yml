          printf 'JAVA_TEST_JOBS=%s\n' "$JAVA_TEST_JOBS"
          printf 'PROTOS_TEST_JOBS=%s\n' "$PROTOS_TEST_JOBS"

      - name: Download revision-bound plan
        uses: actions/download-artifact@v4
        with:
          name: java-plan-${{ github.sha }}
          path: target/java-test-shards
      - name: Run Java parallel partition
        run: |
          mkdir -p target/ci-logs
          make test-java-parallel 2>&1 | tee target/ci-logs/java-parallel.log
      - name: Record lane wall time
