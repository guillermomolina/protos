              cat "/sys/fs/cgroup/$resource"
            fi
          done
          java -XshowSettings:system -version
          printf 'JAVA_TEST_JOBS=%s\n' "$JAVA_TEST_JOBS"
          printf 'PROTOS_TEST_JOBS=%s\n' "$PROTOS_TEST_JOBS"

      - name: Package checkout CLI
        run: make prepare-protos-tests
      - name: Obtain authoritative Case listings
        run: |
          mkdir -p target/protos-test-evidence
          bin/protos test --list-cases > target/protos-test-evidence/complete-listing.json
          bin/protos test --list-cases --shard-count "$PROTOS_TEST_SHARD_COUNT" --shard-run "$PROTOS_TEST_SHARD_INDEX" > target/protos-test-evidence/shard-listing.json
      # The EXIT trap records make's real status (pipefail) while the step
      # itself still fails with it.
      - name: Run protos-suite partition
        run: |
          mkdir -p target/ci-logs
          trap 'printf "%s\n" "$?" > target/ci-logs/protos-suite.exit' EXIT
          make test-protos-suite PROTOS_TEST_SHARD_COUNT="$PROTOS_TEST_SHARD_COUNT" PROTOS_TEST_SHARD_INDEX="$PROTOS_TEST_SHARD_INDEX" PROTOS_TEST_JOBS="$PROTOS_TEST_JOBS" 2>&1 | tee target/ci-logs/protos-suite.log
      - name: Record Protos shard evidence
        if: always()
        run: >-
          python3 tools/ci_protos_test_shards.py report
          --listing target/protos-test-evidence/complete-listing.json
          --shard-listing target/protos-test-evidence/shard-listing.json
          --log target/ci-logs/protos-suite.log
          --exit-status-file target/ci-logs/protos-suite.exit
          --count "$PROTOS_TEST_SHARD_COUNT"
          --index "$PROTOS_TEST_SHARD_INDEX"
          --jobs "$PROTOS_TEST_JOBS"
          --output target/protos-test-evidence/protos-result.json
      - name: Record lane wall time
        if: always()
        run: |
          start=$(cat "$RUNNER_TEMP/lane-start" 2>/dev/null || date +%s)
          duration=$(( $(date +%s) - start ))
          printf 'LANE_DURATION_SECONDS=%s\n' "$duration"
          printf 'Wall time: %s seconds\n' "$duration" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Protos shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protos-evidence-suite-${{ matrix.shard }}-${{ github.sha }}
          if-no-files-found: warn
          path: |
            target/protos-test-evidence/
            target/ci-logs/protos-suite.log
            target/ci-logs/protos-suite.exit
      - name: Upload lane diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protos-suite-${{ matrix.shard }}-${{ github.sha }}
          if-no-files-found: warn
          path: |
            target/ci-logs/protos-suite.log
            target/*report*
            target/dist/
