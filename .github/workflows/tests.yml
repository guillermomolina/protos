        run: |
          start=$(cat "$RUNNER_TEMP/lane-start" 2>/dev/null || date +%s)
          duration=$(( $(date +%s) - start ))
          printf 'LANE_DURATION_SECONDS=%s\n' "$duration"
          printf 'Wall time: %s seconds\n' "$duration" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lane diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-image-${{ github.sha }}
          if-no-files-found: warn
          path: |
            target/ci-logs/native-image.log
            target/native-test-reports/
            target/native/*.log
            target/native/*.json
  aggregate:
    if: always()
    needs: [prepare, compilerability, java-parallel, java-serial, protos-plan, protos-suite, protos-foreign, native-image]
    timeout-minutes: 120
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download revision-bound plan
        uses: actions/download-artifact@v4
        with:
          name: java-plan-${{ github.sha }}
          path: target/java-test-shards
      - name: Download Java execution evidence
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: java-evidence-*-${{ github.sha }}
          path: target/ci-evidence
      - name: Download revision-bound Protos plan
        if: always()
        uses: actions/download-artifact@v4
        with:
          name: protos-plan-${{ github.sha }}
          path: target/protos-test-shards
      - name: Download Protos execution evidence
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: protos-evidence-*-${{ github.sha }}
          path: target/ci-protos-evidence
      - name: Verify dependencies and coverage
        if: always()
        env:
          DEPENDENCY_RESULTS: ${{ toJSON(needs) }}
        run: >-
          python3 tools/ci_validation_aggregate.py
          --plan target/java-test-shards/plan.json
          --results target/ci-evidence
          --dependencies "$DEPENDENCY_RESULTS"
          --protos-plan target/protos-test-shards/plan.json
          --protos-results target/ci-protos-evidence
          --protos-shard-count "$PROTOS_TEST_SHARD_COUNT"
          --output target/ci-aggregate/result.json
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Upload aggregate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aggregate-${{ github.sha }}
          if-no-files-found: error
          path: target/ci-aggregate/result.json
