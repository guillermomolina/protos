name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run repository tests in development container
        uses: devcontainers/ci@v0.3
        with:
          configFile: .devcontainer/devcontainer.json
          imageName: ghcr.io/guillermomolina/protos-devcontainer
          imageTag: ci
          cacheFrom: ghcr.io/guillermomolina/protos-devcontainer:ci
          push: filter
          refFilterForPush: refs/heads/main
          eventFilterForPush: push
          runCmd: |
            set -euo pipefail
            python3 tools/verify_toolchain.py --mode check --scope development
            make test JAVA_TEST_JOBS=4 PROTOS_TEST_JOBS=4
            echo "CI_REPOSITORY_TESTS: PASS"
