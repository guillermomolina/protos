name: CI (suspended)

on:
  workflow_dispatch:

permissions:
  contents: read

# GITHUB017 / #492
# Automatic repository test CI is intentionally suspended while TOOL005 / #468
# completes the repository-wide Test Tool execution path. Do not re-enable
# push/pull_request triggers or test/distribution execution until that blocker
# is closed and GITHUB017 performs the explicit reactivation validation.
#
# This workflow deliberately publishes no passing test signal while suspended.

jobs:
  suspended:
    name: Tests suspended pending TOOL005
    runs-on: ubuntu-latest
    steps:
      - name: Explain suspension
        shell: bash
        run: |
          echo "AUTOMATIC_TEST_CI=SUSPENDED"
          echo "BLOCKED_BY=TOOL005/#468"
          echo "TRACKING=GITHUB017/#492"
          echo "NO_TESTS_EXECUTED=YES"
