name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/graalvm/graalvm-community:25i3-25.0.4.1-ol8-20260825
      options: --user 0

    env:
      PROTOS_PRIMARY_JDK_FEATURE: "25"
      PROTOS_PRIMARY_JDK_VERSION: "25.0.4.1"
      PROTOS_MAVEN_VERSION: "3.9.9"

    steps:
      - name: Provision CI bootstrap tools
        shell: bash
        run: |
          set -euo pipefail
          microdnf install -y git gzip tar python39
          microdnf clean all

          archive="apache-maven-${PROTOS_MAVEN_VERSION}-bin.tar.gz"
          base="https://archive.apache.org/dist/maven/maven-3/${PROTOS_MAVEN_VERSION}/binaries"
          curl --fail --location --silent --show-error "$base/$archive" --output "/tmp/$archive"
          curl --fail --location --silent --show-error "$base/$archive.sha512" --output "/tmp/$archive.sha512"
          expected_sha512="$(cat "/tmp/$archive.sha512")"
          test -n "$expected_sha512"
          test "${#expected_sha512}" -eq 128
          case "$expected_sha512" in
            *[!0-9A-Fa-f]*)
              echo "invalid Maven SHA-512 metadata" >&2
              exit 1
              ;;
          esac
          actual_sha512="$(sha512sum "/tmp/$archive")"
          actual_sha512="${actual_sha512%% *}"
          test "${actual_sha512,,}" = "${expected_sha512,,}"
          echo "MAVEN_ARCHIVE_SHA512_CHECK: PASS"
          tar --extract --gzip --file "/tmp/$archive" --directory /opt
          ln --symbolic "/opt/apache-maven-${PROTOS_MAVEN_VERSION}" /opt/maven
          echo "/opt/maven/bin" >> "$GITHUB_PATH"
          echo "MAVEN_HOME=/opt/maven" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust checked-out workspace for Git
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --porcelain=v1 --untracked-files=all >/dev/null
          echo "CI_GIT_SAFE_DIRECTORY_CHECK: PASS"

      - name: Verify selected toolchain
        shell: bash
        run: |
          set -euo pipefail
          properties="$(java -XshowSettings:properties -version 2>&1)"
          feature="$(sed -n 's/^[[:space:]]*java\.specification\.version = //p' <<<"$properties" | head -n 1)"
          version="$(sed -n 's/^[[:space:]]*java\.version = //p' <<<"$properties" | head -n 1)"
          printf '%s\n' "$properties" | grep -Ei 'graalvm|java\.vendor|java\.vm\.name|java\.runtime\.name' | grep -Fqi GraalVM
          test "$feature" = "$PROTOS_PRIMARY_JDK_FEATURE"
          test "$version" = "$PROTOS_PRIMARY_JDK_VERSION"
          test "$(mvn --version | sed -n '1s/^Apache Maven \([^[:space:]]*\).*/\1/p')" = "$PROTOS_MAVEN_VERSION"
          python3 tools/verify_toolchain.py --mode check --scope development
          echo "CI_PRIMARY_TOOLCHAIN_CHECK: PASS java.version=$version maven=$PROTOS_MAVEN_VERSION"

      - name: Run impact-aware tests
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          head_sha="$(git rev-parse HEAD)"
          case "$EVENT_NAME" in
            pull_request)
              base_sha="$PR_BASE_SHA"
              ;;
            push)
              base_sha="$PUSH_BEFORE_SHA"
              if [[ -z "$base_sha" || "$base_sha" =~ ^0+$ ]]; then
                base_sha="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "$head_sha")"
              fi
              ;;
            workflow_dispatch)
              base_sha="$(git rev-parse HEAD^ 2>/dev/null || printf '%s' "$head_sha")"
              ;;
            *)
              echo "unsupported CI event for validation routing: $EVENT_NAME" >&2
              exit 2
              ;;
          esac

          git cat-file -e "${base_sha}^{commit}"
          echo "CI_VALIDATION_BASE=$base_sha"
          echo "CI_VALIDATION_HEAD=$head_sha"

          python3 scripts/publication_validation.py \
            --repo . \
            --base "$base_sha" \
            --head "$head_sha"

      # The badge is observability only. Keep the JUnit XML even when the test
      # step fails so a later least-privilege job can publish the failure count.
      - name: Upload JUnit reports for test badge
        if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v7
        with:
          name: junit-reports-${{ github.run_attempt }}
          path: |
            **/target/surefire-reports/TEST-*.xml
          if-no-files-found: ignore
          retention-days: 1
          compression-level: 6

  # PERF007: the test job is the single owner of repository JUnit validation.
  # This job consumes that success and validates only the built distribution artifact.
  distribution:
    name: Build and validate portable distribution
    if: ${{ github.event_name != 'pull_request' }}
    needs: test
    concurrency:
      group: distribution-snapshot-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/graalvm/graalvm-community:25i3-25.0.4.1-ol8-20260825
      options: --user 0

    env:
      PROTOS_PRIMARY_JDK_FEATURE: "25"
      PROTOS_PRIMARY_JDK_VERSION: "25.0.4.1"
      PROTOS_MAVEN_VERSION: "3.9.9"

    steps:
      - name: Provision CI bootstrap tools
        shell: bash
        run: |
          set -euo pipefail
          microdnf install -y git gzip tar unzip xz python39 findutils diffutils
          microdnf clean all

          archive="apache-maven-${PROTOS_MAVEN_VERSION}-bin.tar.gz"
          base="https://archive.apache.org/dist/maven/maven-3/${PROTOS_MAVEN_VERSION}/binaries"
          curl --fail --location --silent --show-error "$base/$archive" --output "/tmp/$archive"
          curl --fail --location --silent --show-error "$base/$archive.sha512" --output "/tmp/$archive.sha512"
          expected_sha512="$(cat "/tmp/$archive.sha512")"
          test -n "$expected_sha512"
          test "${#expected_sha512}" -eq 128
          case "$expected_sha512" in
            *[!0-9A-Fa-f]*)
              echo "invalid Maven SHA-512 metadata" >&2
              exit 1
              ;;
          esac
          actual_sha512="$(sha512sum "/tmp/$archive")"
          actual_sha512="${actual_sha512%% *}"
          test "${actual_sha512,,}" = "${expected_sha512,,}"
          echo "MAVEN_ARCHIVE_SHA512_CHECK: PASS"
          tar --extract --gzip --file "/tmp/$archive" --directory /opt
          ln --symbolic "/opt/apache-maven-${PROTOS_MAVEN_VERSION}" /opt/maven
          echo "/opt/maven/bin" >> "$GITHUB_PATH"
          echo "MAVEN_HOME=/opt/maven" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Trust checked-out workspace for Git
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git status --porcelain=v1 --untracked-files=all >/dev/null
          echo "CI_GIT_SAFE_DIRECTORY_CHECK: PASS"

      - name: Verify selected toolchain
        shell: bash
        run: |
          set -euo pipefail
          properties="$(java -XshowSettings:properties -version 2>&1)"
          feature="$(sed -n 's/^[[:space:]]*java\.specification\.version = //p' <<<"$properties" | head -n 1)"
          version="$(sed -n 's/^[[:space:]]*java\.version = //p' <<<"$properties" | head -n 1)"
          printf '%s\n' "$properties" | grep -Ei 'graalvm|java\.vendor|java\.vm\.name|java\.runtime\.name' | grep -Fqi GraalVM
          test "$feature" = "$PROTOS_PRIMARY_JDK_FEATURE"
          test "$version" = "$PROTOS_PRIMARY_JDK_VERSION"
          test "$(mvn --version | sed -n '1s/^Apache Maven \([^[:space:]]*\).*/\1/p')" = "$PROTOS_MAVEN_VERSION"
          python3 tools/verify_toolchain.py --mode check
          echo "CI_PRIMARY_TOOLCHAIN_CHECK: PASS java.version=$version maven=$PROTOS_MAVEN_VERSION"

      - name: Build portable distribution
        run: python3 dist/build_portable.py

      - name: Run complete extracted-distribution gate
        shell: bash
        run: |
          set -euo pipefail
          sh dist/validate_portable.sh --require-clean-source

      - name: Prepare snapshot artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="$(find "$GITHUB_WORKSPACE/target/distributions" -maxdepth 1 -type f -name 'protos-*-posix-jvm.zip' | sort | tail -n 1)"
          test -n "$archive"
          test -f "$archive"
          (cd "$(dirname "$archive")" && sha256sum "$(basename "$archive")") > "$archive.sha256"
          (
            cd "$(dirname "$archive")"
            sha256sum -c "$(basename "$archive").sha256"
          )
          echo "DIST_ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "DIST_ARCHIVE_CHECKSUM=$archive.sha256" >> "$GITHUB_ENV"
          echo "DIST_ARTIFACT_NAME=protos-snapshot-$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "CI_SNAPSHOT_CHECKSUM: $(cat "$archive.sha256")"

      - name: Upload development snapshot
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DIST_ARTIFACT_NAME }}
          path: |
            ${{ env.DIST_ARCHIVE }}
            ${{ env.DIST_ARCHIVE_CHECKSUM }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  status-badges:
    name: Publish README status badges
    needs:
      - test
      - distribution
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: protos-status-badges-main
      cancel-in-progress: false

    steps:
      - name: Check out repository for badge publication
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download JUnit reports
        id: reports
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: junit-reports-${{ github.run_attempt }}
          path: junit-reports

      - name: Render self-hosted status badges
        id: badge
        shell: bash
        env:
          TEST_JOB_RESULT: ${{ needs.test.result }}
          DISTRIBUTION_JOB_RESULT: ${{ needs.distribution.result }}
        run: |
          set -euo pipefail
          mkdir -p target/status-badges

          python3 - "$TEST_JOB_RESULT" "$DISTRIBUTION_JOB_RESULT" target/status-badges <<'PY_BADGE'
          from __future__ import print_function

          import html
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET

          test_result = sys.argv[1]
          distribution_result = sys.argv[2]
          output = Path(sys.argv[3])

          COLORS = {
              "brightgreen": "#4c1",
              "red": "#e05d44",
              "orange": "#fe7d37",
              "blue": "#007ec6",
              "lightgrey": "#9f9f9f",
          }

          def render_badge(path, label, message, color_name):
              color = COLORS[color_name]
              left = max(34, 12 + len(label) * 7)
              right = max(44, 12 + len(message) * 7)
              width = left + right
              title = html.escape("%s: %s" % (label, message), quote=True)
              label_text = html.escape(label)
              message_text = html.escape(message)

              svg = (
                  '<svg xmlns="http://www.w3.org/2000/svg" width="%d" height="20" '
                  'role="img" aria-label="%s">'
                  '<title>%s</title>'
                  '<clipPath id="r"><rect width="%d" height="20" rx="3"/></clipPath>'
                  '<g clip-path="url(#r)">'
                  '<rect width="%d" height="20" fill="#555"/>'
                  '<rect x="%d" width="%d" height="20" fill="%s"/>'
                  '</g>'
                  '<g fill="#fff" text-anchor="middle" '
                  'font-family="Verdana,Geneva,DejaVu Sans,sans-serif" font-size="11">'
                  '<text x="%s" y="14">%s</text>'
                  '<text x="%s" y="14">%s</text>'
                  '</g></svg>\n'
              ) % (
                  width,
                  title,
                  title,
                  width,
                  left,
                  left,
                  right,
                  color,
                  left / 2.0,
                  label_text,
                  left + right / 2.0,
                  message_text,
              )
              path.write_text(svg, encoding="utf-8")

          if test_result == "success" and distribution_result == "success":
              ci_message, ci_color = "passing", "brightgreen"
          elif "cancelled" in (test_result, distribution_result):
              ci_message, ci_color = "cancelled", "orange"
          elif "failure" in (test_result, distribution_result):
              ci_message, ci_color = "failing", "red"
          else:
              ci_message, ci_color = "incomplete", "orange"

          render_badge(output / "ci.svg", "CI", ci_message, ci_color)

          reports_root = Path("junit-reports")
          reports = sorted(reports_root.rglob("TEST-*.xml")) if reports_root.exists() else []

          total = 0
          failed = 0
          skipped = 0
          for report in reports:
              root = ET.parse(str(report)).getroot()
              tag = root.tag.rsplit("}", 1)[-1]
              if tag != "testsuite":
                  raise SystemExit("unexpected JUnit root in %s: %s" % (report, tag))
              total += int(root.attrib.get("tests", "0"))
              failed += int(root.attrib.get("failures", "0"))
              failed += int(root.attrib.get("errors", "0"))
              skipped += int(root.attrib.get("skipped", "0"))

          if total > 0:
              passed = total - failed - skipped
              if failed:
                  message = "%d failed / %d" % (failed, total)
                  color = "red"
              elif skipped:
                  message = "%d passed · %d skipped" % (passed, skipped)
                  color = "brightgreen"
              else:
                  message = "%d passed" % passed
                  color = "brightgreen"
              render_badge(output / "tests.svg", "TESTS", message, color)
              print(
                  "TEST_BADGE: total=%d passed=%d failed=%d skipped=%d"
                  % (total, passed, failed, skipped)
              )
          elif test_result != "success":
              render_badge(
                  output / "tests.svg",
                  "TESTS",
                  "CI failed before results",
                  "red" if test_result == "failure" else "orange",
              )
              print("TEST_BADGE: no JUnit reports because test job=%s" % test_result)
          else:
              # A successful impact-aware run with no JUnit reports must not
              # erase useful prior evidence. Publish CI only and preserve the
              # previous tests.svg on the badges branch.
              print("TEST_BADGE: PRESERVE_PREVIOUS_NO_REPORTS")

          print(
              "CI_BADGE: test=%s distribution=%s rendered=%s"
              % (test_result, distribution_result, ci_message)
          )
          PY_BADGE

      - name: Publish self-hosted badge branch
        shell: bash
        run: |
          set -euo pipefail

          # Only the run for the current main HEAD may publish README badges.
          # Older runs can legitimately finish later after distribution
          # cancellation/concurrency, but must never replace current status.
          git fetch --no-tags origin main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$GITHUB_SHA" != "$current_main" ]]; then
            echo "STATUS_BADGES: SUPERSEDED_RUN_SKIPPED current=$GITHUB_SHA main=$current_main"
            exit 0
          fi

          badge_tree="$(mktemp -d)"
          rmdir "$badge_tree"

          cleanup_badge_tree() {
            if git worktree list --porcelain | grep -Fqx "worktree $badge_tree"; then
              git worktree remove --force "$badge_tree" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_badge_tree EXIT

          if git ls-remote --exit-code --heads origin refs/heads/badges >/dev/null 2>&1; then
            git fetch --no-tags origin refs/heads/badges:refs/remotes/origin/badges
            git worktree add --detach "$badge_tree" refs/remotes/origin/badges
            git -C "$badge_tree" switch -C badges

            if [[ -f "$badge_tree/source.sha" ]]; then
              previous_sha="$(tr -d '[:space:]' < "$badge_tree/source.sha")"
              if [[ -n "$previous_sha" ]] && git cat-file -e "${previous_sha}^{commit}" 2>/dev/null; then
                if git merge-base --is-ancestor "$GITHUB_SHA" "$previous_sha"; then
                  echo "STATUS_BADGES: STALE_RESULT_SKIPPED current=$GITHUB_SHA published=$previous_sha"
                  exit 0
                fi
                if ! git merge-base --is-ancestor "$previous_sha" "$GITHUB_SHA"; then
                  echo "STATUS_BADGES: UNRELATED_HISTORY_SKIPPED current=$GITHUB_SHA published=$previous_sha"
                  exit 0
                fi
              fi
            fi
          else
            git worktree add --detach "$badge_tree" HEAD
            git -C "$badge_tree" switch --orphan badges
            git -C "$badge_tree" rm -rf . >/dev/null 2>&1 || true
          fi

          cp target/status-badges/ci.svg "$badge_tree/ci.svg"
          if [[ -f target/status-badges/tests.svg ]]; then
            cp target/status-badges/tests.svg "$badge_tree/tests.svg"
          fi
          printf '%s\n' "$GITHUB_SHA" > "$badge_tree/source.sha"

          # Retire the old Shields endpoint payload if it is still present.
          if [[ -f "$badge_tree/tests.json" ]]; then
            rm "$badge_tree/tests.json"
          fi

          git -C "$badge_tree" config user.name "github-actions[bot]"
          git -C "$badge_tree" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$badge_tree" add -- ci.svg source.sha
          if [[ -f "$badge_tree/tests.svg" ]]; then
            git -C "$badge_tree" add -- tests.svg
          fi
          if git -C "$badge_tree" ls-files --error-unmatch tests.json >/dev/null 2>&1; then
            git -C "$badge_tree" add -u -- tests.json
          fi

          if git -C "$badge_tree" diff --cached --quiet; then
            echo "STATUS_BADGES: NO_CHANGE"
            exit 0
          fi

          # Re-check main immediately before publication. This closes the
          # ordinary race where main advances while SVGs are being prepared.
          git fetch --no-tags origin main
          publish_main="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$GITHUB_SHA" != "$publish_main" ]]; then
            echo "STATUS_BADGES: SUPERSEDED_BEFORE_PUSH_SKIPPED current=$GITHUB_SHA main=$publish_main"
            exit 0
          fi

          git -C "$badge_tree" commit -m "Update README status badges [skip ci]"
          git -C "$badge_tree" push origin HEAD:refs/heads/badges
          echo "STATUS_BADGES: PUBLISHED source=$GITHUB_SHA"
