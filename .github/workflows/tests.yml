name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# Planning count and per-runner concurrency are independent controls.
env:
  JAVA_TEST_SHARD_COUNT: "4"
  JAVA_TEST_JOBS: "2"
  PROTOS_TEST_JOBS: "2"
  PROTOS_TEST_SHARD_COUNT: "4"

defaults:
  run:
    shell: bash

jobs:
  prepare:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    outputs:
      count: ${{ steps.plan.outputs.count }}
      indices: ${{ steps.plan.outputs.indices }}
    container:
      image: ghcr.io/guillermomolina/protos-ci@sha256:44e03c759ccd2b57135f5c0bdbb5060563e858601daa73958ab6cbba2ffc5fe3
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0

    steps:
      - name: Start lane clock
        run: |
          mkdir -p target/ci-logs
          date +%s > "$RUNNER_TEMP/lane-start"
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust checked-out repository
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Restore Maven dependency cache
        id: maven-cache
        uses: ./.github/actions/maven-cache-restore

      - name: Report available CPU resources
        run: |
          printf 'CPU_NPROC=%s\n' "$(nproc)"
          printf 'CPU_ONLINE=%s\n' "$(getconf _NPROCESSORS_ONLN)"
          if [ -r /sys/fs/cgroup/cpu.max ]; then
            printf 'CPU_CGROUP_MAX='
            cat /sys/fs/cgroup/cpu.max
          fi
          if [ -r /proc/meminfo ]; then head -n 5 /proc/meminfo; fi
          for resource in memory.max memory.current memory.peak; do
            if [ -r "/sys/fs/cgroup/$resource" ]; then
              printf '%s=' "$resource"
              cat "/sys/fs/cgroup/$resource"
            fi
          done
          java -XshowSettings:system -version
          printf 'JAVA_TEST_JOBS=%s\n' "$JAVA_TEST_JOBS"
          printf 'PROTOS_TEST_JOBS=%s\n' "$PROTOS_TEST_JOBS"

      - name: Exercise CI orchestration regressions
        run: |
          python3 tools/tests/test_ci_java_test_shards.py
          python3 tools/tests/test_ci_protos_test_shards.py
          python3 tools/tests/test_ci_validation_aggregate.py
          python3 tools/tests/test_verify_toolchain.py
      - name: Prepare Java partition plan
        run: make prepare-java-test-shards
      - name: Export validated partition matrix
        id: plan
        run: python3 tools/ci_java_test_shards.py outputs >> "$GITHUB_OUTPUT"
      - name: Upload revision-bound plan
        uses: actions/upload-artifact@v4
        with:
          name: java-plan-${{ github.sha }}
          if-no-files-found: error
          path: |
            target/java-test-shards/plan.json
            target/java-test-shards/*.includes
      # Explicit, non-blocking save with the key computed before validation;
      # no post-job step recomputes the key over a populated workspace.
      - name: Save Maven dependency cache
        if: success() && steps.maven-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: /root/.m2/repository
          key: ${{ steps.maven-cache.outputs.cache-key }}
      - name: Record lane wall time
        if: always()
        run: |
          start=$(cat "$RUNNER_TEMP/lane-start" 2>/dev/null || date +%s)
          duration=$(( $(date +%s) - start ))
          printf 'LANE_DURATION_SECONDS=%s\n' "$duration"
          printf 'Wall time: %s seconds\n' "$duration" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lane diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepare-${{ github.sha }}
          if-no-files-found: warn
          path: |
            target/java-test-shards/plan.json
  compilerability:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/guillermomolina/protos-ci@sha256:44e03c759ccd2b57135f5c0bdbb5060563e858601daa73958ab6cbba2ffc5fe3
      credentials:
