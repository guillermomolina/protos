        with:
          name: java-evidence-parallel-${{ matrix.shard }}-${{ github.sha }}
          if-no-files-found: warn
          path: |
            target/java-test-reports/parallel-${{ matrix.shard }}/
            target/ci-logs/java-parallel.log
  java-serial:
    timeout-minutes: 120
    runs-on: ubuntu-latest
    needs: prepare
    env:
      JAVA_TEST_SHARD_COUNT: ${{ needs.prepare.outputs.count }}
      JAVA_TEST_SHARD_INDEX: "1"
      JAVA_SERIAL_REPORTS: target/java-test-reports/serial
    container:
      image: ghcr.io/guillermomolina/protos-ci@sha256:44e03c759ccd2b57135f5c0bdbb5060563e858601daa73958ab6cbba2ffc5fe3
