name: DIST017 focused recursion diagnosis

on:
  push:
    branches:
      - graalvm-25-5
    paths:
      - .github/workflows/diagnose-recursion.yml
      - src/main/java/com/guillermomolina/protos/runtime/ProtosTask.java
      - src/main/java/com/guillermomolina/protos/runtime/ProtosActorExecutionDomain.java
      - src/main/java/com/guillermomolina/protos/runtime/process/ProtosProcessRuntime.java

permissions:
  contents: read
  packages: read

jobs:
  recursion:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    container:
      image: ghcr.io/guillermomolina/protos-ci@sha256:44e03c759ccd2b57135f5c0bdbb5060563e858601daa73958ab6cbba2ffc5fe3
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user 0

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Restore Maven dependencies
        uses: actions/cache@v6
        with:
          path: /root/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build without tests
        run: mvn -B -DskipTests package

      - name: Test deep recursion in isolation
        env:
          JAVA_TOOL_OPTIONS: -Dprotos.diagnostics.termination=true
        run: |
          timeout --signal=QUIT --kill-after=5s 120s             bin/protos test             --file protos/tests/conformance/regression/deep-recursive-closure-call-stack-capacity.protos             --jobs 4

      - name: Test regression suite
        run: |
          timeout --signal=QUIT --kill-after=5s 180s             bin/protos test             --directory protos/tests/conformance/regression             --jobs 4
